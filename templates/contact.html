{% extends "base.html" %}

{% block title %}Contact Support — DermaAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-headset"></i></div>
            <h2>Medical & Technical Support</h2>
            <p>Have questions regarding clinical integration or platform support?</p>
        </div>

        <form method="POST" action="{{ url_for('contact_page') }}" class="auth-form">
            <div class="form-group">
                <label for="cname"><i class="fa-solid fa-user"></i> Your Name</label>
                <input type="text" id="cname" name="name" class="form-control" placeholder="Dr. Jane Doe" required>
            </div>

            <div class="form-group">
                <label for="cemail"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="cemail" name="email" class="form-control" placeholder="doctor@hospital.org" required>
            </div>

            <div class="form-group">
                <label for="cmessage"><i class="fa-solid fa-comment-medical"></i> Message Inquiry</label>
                <textarea id="cmessage" name="message" class="form-control" rows="4" placeholder="How can our clinical engineering team assist you?" required></textarea>
            </div>

            <button type="submit" class="btn btn-auth-submit">
                <i class="fa-solid fa-paper-plane"></i> Send Inquiry
            </button>
        </form>
    </div>
</div>
{% endblock %}
