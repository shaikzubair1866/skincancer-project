{% extends "base.html" %}

{% block title %}Login — DermaAI Clinical Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-user-lock"></i></div>
            <h2>Account Login</h2>
            <p>Access your skin cancer diagnostic portal and scan history</p>
        </div>

        <form method="POST" action="{{ url_for('login_page') }}" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="doctor@hospital.org" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-auth-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('signup_page') }}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
