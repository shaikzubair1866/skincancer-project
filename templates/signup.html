{% extends "base.html" %}

{% block title %}Sign Up — DermaAI Clinical Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
            <h2>Create New Account</h2>
            <p>Register to start scanning skin images and tracking scan history</p>
        </div>

        <form method="POST" action="{{ url_for('signup_page') }}" class="auth-form">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Dr. Sarah Connor" required autofocus>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="doctor@hospital.org" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password (min 6 characters)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-auth-submit">
                <i class="fa-solid fa-circle-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already registered? <a href="{{ url_for('login_page') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
